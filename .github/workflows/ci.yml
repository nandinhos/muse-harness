name: CLEARER Muse Quality & Test Suite

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  validate:
    name: Validate Harness & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check on Bash scripts
        run: |
          find profiles/clearer-muse/scripts -name "*.sh" -exec bash -n {} +
          bash -n evals/run.sh

      - name: Syntax check on Python scripts
        run: |
          python3 -m py_compile profiles/clearer-muse/hooks/safety-gate.py
          python3 -m py_compile profiles/clearer-muse/scripts/doc-audit.py
          python3 -m py_compile profiles/clearer-muse/scripts/token-budget.py

      - name: Make scripts executable
        run: |
          chmod +x profiles/clearer-muse/scripts/*.sh
          chmod +x evals/run.sh

      - name: Run canonical smoke-eval suite (CEH-SAFETY contract)
        run: |
          bash evals/run.sh

      - name: Run full profile suite (contract + scripts smoke)
        run: |
          bash profiles/clearer-muse/tests/run-all-tests.sh

      - name: Run integration scripts (read-only smoke)
        run: |
          bash profiles/clearer-muse/scripts/detect-project.sh .
          bash profiles/clearer-muse/scripts/preflight.sh
          bash profiles/clearer-muse/scripts/ceh-help.sh > /dev/null
          bash profiles/clearer-muse/scripts/task-monitor.sh
          bash profiles/clearer-muse/scripts/evidence-report.sh > /dev/null
          python3 profiles/clearer-muse/hooks/safety-gate.py "git status"

      - name: Test branch topologies in isolated sandbox
        run: |
          TMP_ENT=$(mktemp -d)
          git -C "$TMP_ENT" init -b main
          git -C "$TMP_ENT" config user.name "CI"
          git -C "$TMP_ENT" config user.email "ci@clearer.dev"
          touch "$TMP_ENT/README.md"
          git -C "$TMP_ENT" add README.md
          git -C "$TMP_ENT" commit -m "init"
          bash profiles/clearer-muse/scripts/setup-branches.sh --enterprise "$TMP_ENT"
          rm -rf "$TMP_ENT"

          TMP_CLS=$(mktemp -d)
          git -C "$TMP_CLS" init -b main
          git -C "$TMP_CLS" config user.name "CI"
          git -C "$TMP_CLS" config user.email "ci@clearer.dev"
          touch "$TMP_CLS/README.md"
          git -C "$TMP_CLS" add README.md
          git -C "$TMP_CLS" commit -m "init"
          bash profiles/clearer-muse/scripts/setup-branches.sh --classic "$TMP_CLS"
          git -C "$TMP_CLS" show-ref --verify --quiet refs/heads/dev
          rm -rf "$TMP_CLS"
